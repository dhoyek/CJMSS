<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 15px;
            height: 400px;
            overflow: hidden;
        }

        .timeline-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .timeline-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #343a40;
        }

        .timeline-filter {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-button {
            padding: 6px 12px;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            background: white;
            color: #6c757d;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

            .filter-button.active {
                background: #007bff;
                color: white;
                border-color: #007bff;
            }

            .filter-button:hover {
                background: #f8f9fa;
            }

            .filter-button.active:hover {
                background: #0056b3;
            }

        .timeline-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .timeline-item {
            position: relative;
            padding-left: 40px;
            padding-bottom: 20px;
        }

            .timeline-item:not(:last-child)::before {
                content: '';
                position: absolute;
                left: 15px;
                top: 35px;
                bottom: -5px;
                width: 2px;
                background: #e9ecef;
            }

        .timeline-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            z-index: 1;
        }

            .timeline-icon.inbound {
                background: #28a745;
            }

            .timeline-icon.outbound {
                background: #dc3545;
            }

            .timeline-icon.adjustment {
                background: #ffc107;
                color: #212529;
            }

            .timeline-icon.transfer {
                background: #17a2b8;
            }

            .timeline-icon.count {
                background: #6f42c1;
            }

        .timeline-content-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 5px;
            border-left: 4px solid;
        }

            .timeline-content-item.inbound {
                border-color: #28a745;
            }

            .timeline-content-item.outbound {
                border-color: #dc3545;
            }

            .timeline-content-item.adjustment {
                border-color: #ffc107;
            }

            .timeline-content-item.transfer {
                border-color: #17a2b8;
            }

            .timeline-content-item.count {
                border-color: #6f42c1;
            }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .transaction-type {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        .transaction-date {
            font-size: 0.75em;
            color: #6c757d;
        }

        .transaction-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .detail-item {
            font-size: 0.8em;
        }

        .detail-label {
            color: #6c757d;
            margin-bottom: 2px;
        }

        .detail-value {
            font-weight: 600;
            color: #212529;
        }

        .transaction-reference {
            font-size: 0.75em;
            color: #6c757d;
            font-style: italic;
        }

        .loading, .no-data {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #6c757d;
            font-style: italic;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background: #a8a8a8;
            }

        @media (max-width: 600px) {
            .timeline-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .transaction-details {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="timeline-header">
            <h3 class="timeline-title">Transaction History</h3>
            <div class="timeline-filter">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="inbound">In</button>
                <button class="filter-button" data-filter="outbound">Out</button>
                <button class="filter-button" data-filter="adjustment">Adj</button>
            </div>
        </div>

        <div id="timelineContent" class="timeline-content scrollbar-thin">
            <div id="loadingIndicator" class="loading">
                <div>Loading transaction history...</div>
            </div>
        </div>
    </div>

    <script>
        class TransactionTimeline {
            constructor() {
                this.data = null;
                this.currentFilter = 'all';
                this.initialized = false;
                this.init();
            }

            init() {
                this.setupFilterButtons();
                this.loadDataFromUrl();

                // Setup periodic refresh
                setInterval(() => {
                    this.loadDataFromUrl();
                }, 60000);

                this.initialized = true;
            }

            setupFilterButtons() {
                const filterButtons = document.querySelectorAll('.filter-button');
                filterButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        // Update active state
                        filterButtons.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');

                        // Update filter and refresh display
                        this.currentFilter = e.target.dataset.filter;
                        this.updateTimeline();
                    });
                });
            }

            loadDataFromUrl() {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const dataParam = urlParams.get('data');

                    if (dataParam) {
                        const decodedData = decodeURIComponent(dataParam);
                        this.data = JSON.parse(decodedData);
                        this.updateTimeline();
                    } else {
                        this.loadSampleData();
                    }
                } catch (error) {
                    console.error('Error loading transaction data:', error);
                    this.showError();
                }
            }

            loadSampleData() {
                this.data = {
                    transactions: [
                        {
                            id: 'TXN-001',
                            type: 'inbound',
                            date: '2024-01-15T10:30:00',
                            quantity: 50,
                            unitPrice: 875.00,
                            totalValue: 43750.00,
                            reference: 'PO-2024-001',
                            warehouse: 'Main Warehouse',
                            notes: 'Purchase order receipt'
                        },
                        {
                            id: 'TXN-002',
                            type: 'outbound',
                            date: '2024-01-14T14:15:00',
                            quantity: 15,
                            unitPrice: 1250.00,
                            totalValue: 18750.00,
                            reference: 'SO-2024-156',
                            warehouse: 'Showroom',
                            notes: 'Customer sale'
                        },
                        {
                            id: 'TXN-003',
                            type: 'transfer',
                            date: '2024-01-12T09:45:00',
                            quantity: 25,
                            unitPrice: 875.00,
                            totalValue: 21875.00,
                            reference: 'TR-2024-034',
                            warehouse: 'Main Warehouse → Workshop',
                            notes: 'Production transfer'
                        },
                        {
                            id: 'TXN-004',
                            type: 'adjustment',
                            date: '2024-01-10T16:20:00',
                            quantity: -2,
                            unitPrice: 875.00,
                            totalValue: -1750.00,
                            reference: 'ADJ-2024-012',
                            warehouse: 'Workshop',
                            notes: 'Physical count adjustment'
                        },
                        {
                            id: 'TXN-005',
                            type: 'count',
                            date: '2024-01-08T11:00:00',
                            quantity: 0,
                            unitPrice: 0,
                            totalValue: 0,
                            reference: 'CC-2024-W02',
                            warehouse: 'All Locations',
                            notes: 'Cycle count verification'
                        }
                    ]
                };
                this.updateTimeline();
            }

            updateTimeline() {
                const timelineContent = document.getElementById('timelineContent');

                if (!this.data || !this.data.transactions) {
                    timelineContent.innerHTML = '<div class="no-data">No transaction data available</div>';
                    return;
                }

                // Filter transactions
                let filteredTransactions = this.data.transactions;
                if (this.currentFilter !== 'all') {
                    filteredTransactions = this.data.transactions.filter(txn =>
                        txn.type === this.currentFilter
                    );
                }

                // Sort by date (newest first)
                filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (filteredTransactions.length === 0) {
                    timelineContent.innerHTML = '<div class="no-data">No transactions found for selected filter</div>';
                    return;
                }

                // Build timeline HTML
                let timelineHTML = '';
                filteredTransactions.forEach((transaction, index) => {
                    timelineHTML += this.createTimelineItem(transaction, index === filteredTransactions.length - 1);
                });

                timelineContent.innerHTML = timelineHTML;
            }

            createTimelineItem(transaction, isLast) {
                const date = new Date(transaction.date);
                const formattedDate = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const iconSymbol = this.getTransactionIcon(transaction.type);
                const quantityDisplay = transaction.quantity > 0 ? `+${transaction.quantity}` : transaction.quantity.toString();
                const valueDisplay = transaction.totalValue !== 0 ? this.formatCurrency(Math.abs(transaction.totalValue)) : 'N/A';

                return `
                        <div class="timeline-item">
                            <div class="timeline-icon ${transaction.type}">${iconSymbol}</div>
                            <div class="timeline-content-item ${transaction.type}">
                                <div class="transaction-header">
                                    <div class="transaction-type">${this.getTransactionTypeName(transaction.type)}</div>
                                    <div class="transaction-date">${formattedDate}</div>
                                </div>
                                <div class="transaction-details">
                                    <div class="detail-item">
                                        <div class="detail-label">Quantity</div>
                                        <div class="detail-value">${quantityDisplay}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Value</div>
                                        <div class="detail-value">${valueDisplay}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Location</div>
                                        <div class="detail-value">${transaction.warehouse || 'N/A'}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Unit Price</div>
                                        <div class="detail-value">${transaction.unitPrice > 0 ? this.formatCurrency(transaction.unitPrice) : 'N/A'}</div>
                                    </div>
                                </div>
                                <div class="transaction-reference">
                                    ${transaction.reference} • ${transaction.notes || 'No additional notes'}
                                </div>
                            </div>
                        </div>
                    `;
            }

            getTransactionIcon(type) {
                const icons = {
                    'inbound': '↓',
                    'outbound': '↑',
                    'adjustment': '±',
                    'transfer': '⇄',
                    'count': '✓'
                };
                return icons[type] || '?';
            }

            getTransactionTypeName(type) {
                const names = {
                    'inbound': 'Stock Receipt',
                    'outbound': 'Stock Issue',
                    'adjustment': 'Inventory Adjustment',
                    'transfer': 'Stock Transfer',
                    'count': 'Physical Count'
                };
                return names[type] || 'Unknown Transaction';
            }

            formatCurrency(value) {
                if (value === null || value === undefined) return '$--';

                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 2
                }).format(value);
            }

            showError() {
                document.getElementById('timelineContent').innerHTML =
                    '<div class="no-data">Error loading transaction history</div>';
            }
        }

        // Initialize timeline when page loads
        document.addEventListener('DOMContentLoaded', function () {
            new TransactionTimeline();
        });

        // Handle parent window messages
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'updateTransactionData') {
                const timeline = new TransactionTimeline();
                timeline.data = event.data.payload;
                timeline.updateTimeline();
            }
        });
    </script>
</body>
</html>
