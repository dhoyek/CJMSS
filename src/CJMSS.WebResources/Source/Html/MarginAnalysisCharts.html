<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #333;
            min-height: 400px;
        }

        .analysis-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            height: calc(100vh - 32px);
            overflow-y: auto;
        }

        .analysis-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e9ecef;
        }

        .analysis-title {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .chart-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #007bff;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #495057;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-bottom: 16px;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .metric-item {
            text-align: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 11px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .health-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .health-excellent {
            background: #d4edda;
            color: #155724;
        }

        .health-good {
            background: #d1ecf1;
            color: #0c5460;
        }

        .health-warning {
            background: #fff3cd;
            color: #856404;
        }

        .health-critical {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e9ecef;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .timestamp {
            text-align: center;
            font-size: 11px;
            color: #adb5bd;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="analysis-container">
        <div class="analysis-header">
            <h1 class="analysis-title">
                📊 Margin Analysis
            </h1>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>Loading margin data...</div>
        </div>

        <div id="analysis-content" style="display: none;">
            <div class="charts-grid">
                <!-- Margin Breakdown Chart -->
                <div class="chart-card">
                    <h3 class="chart-title">💰 Profitability Breakdown</h3>
                    <div class="chart-container">
                        <canvas id="marginChart"></canvas>
                    </div>
                    <div class="metrics-row">
                        <div class="metric-item">
                            <div class="metric-value" id="gross-margin">0%</div>
                            <div class="metric-label">Gross Margin</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" id="markup">0%</div>
                            <div class="metric-label">Markup</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" id="profit-unit">$0.00</div>
                            <div class="metric-label">Profit/Unit</div>
                        </div>
                    </div>
                    <div id="margin-health" class="health-indicator health-good">
                        <span>✅</span>
                        <span>Healthy Margin</span>
                    </div>
                </div>

                <!-- Cost Comparison Chart -->
                <div class="chart-card">
                    <h3 class="chart-title">📈 Cost Analysis</h3>
                    <div class="chart-container">
                        <canvas id="costChart"></canvas>
                    </div>
                    <div class="metrics-row">
                        <div class="metric-item">
                            <div class="metric-value" id="unit-cost">$0.00</div>
                            <div class="metric-label">Unit Cost</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" id="public-price">$0.00</div>
                            <div class="metric-label">Public Price</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" id="cost-variance">0%</div>
                            <div class="metric-label">Cost Variance</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="timestamp" id="timestamp">
                Last updated: Never
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let marginChart = null;
        let costChart = null;
        let marginData = {
            unitCost: 0,
            publicPrice: 0,
            cogp: 0,
            standardCost: 0,
            lastCost: 0,
            averageCost: 0,
            grossMargin: 0,
            markup: 0,
            cogpMargin: 0,
            costVariance: 0,
            costChange: 0,
            profitPerUnit: 0,
            timestamp: null
        };

        // Initialize charts
        function initializeCharts() {
            showLoading();

            // Show dummy data after 2 seconds if no real data received
            setTimeout(() => {
                if (!marginData.timestamp) {
                    showDummyData();
                }
            }, 2000);
        }

        // Show loading state
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('analysis-content').style.display = 'none';
        }

        // Show dummy data for testing
        function showDummyData() {
            const dummyData = {
                unitCost: 125.50,
                publicPrice: 199.99,
                cogp: 140.00,
                standardCost: 120.00,
                lastCost: 122.00,
                averageCost: 128.75,
                grossMargin: 37.2,
                markup: 59.3,
                cogpMargin: 30.0,
                costVariance: 4.6,
                costChange: 2.9,
                profitPerUnit: 74.49,
                timestamp: new Date().toLocaleString()
            };

            updateMarginAnalysis(dummyData);
        }

        // Update margin analysis with new data
        function updateMarginAnalysis(data) {
            marginData = { ...marginData, ...data };

            // Update metrics
            document.getElementById('gross-margin').textContent = formatPercentage(marginData.grossMargin);
            document.getElementById('markup').textContent = formatPercentage(marginData.markup);
            document.getElementById('profit-unit').textContent = formatCurrency(marginData.profitPerUnit);
            document.getElementById('unit-cost').textContent = formatCurrency(marginData.unitCost);
            document.getElementById('public-price').textContent = formatCurrency(marginData.publicPrice);
            document.getElementById('cost-variance').textContent = formatPercentage(marginData.costVariance);

            // Update health indicator
            updateHealthIndicator();

            // Create/update charts
            createMarginChart();
            createCostChart();

            // Update timestamp
            document.getElementById('timestamp').textContent = `Last updated: ${marginData.timestamp || new Date().toLocaleString()}`;

            // Show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('analysis-content').style.display = 'block';
        }

        // Update health indicator based on margin
        function updateHealthIndicator() {
            const healthElement = document.getElementById('margin-health');
            const margin = marginData.grossMargin;

            let healthClass, icon, text;

            if (margin >= 50) {
                healthClass = 'health-excellent';
                icon = '🌟';
                text = 'Excellent Margin';
            } else if (margin >= 35) {
                healthClass = 'health-good';
                icon = '✅';
                text = 'Healthy Margin';
            } else if (margin >= 20) {
                healthClass = 'health-warning';
                icon = '⚠️';
                text = 'Below Target';
            } else {
                healthClass = 'health-critical';
                icon = '🚨';
                text = 'Critical - Review Required';
            }

            healthElement.className = `health-indicator ${healthClass}`;
            healthElement.innerHTML = `<span>${icon}</span><span>${text}</span>`;
        }

        // Create margin breakdown chart
        function createMarginChart() {
            const ctx = document.getElementById('marginChart').getContext('2d');

            if (marginChart) {
                marginChart.destroy();
            }

            const profit = marginData.profitPerUnit;
            const cost = marginData.unitCost;

            marginChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Profit', 'Cost'],
                    datasets: [{
                        data: [profit, cost],
                        backgroundColor: [
                            '#28a745',
                            '#dc3545'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    const label = context.label || '';
                                    const value = formatCurrency(context.parsed);
                                    const percentage = ((context.parsed / (profit + cost)) * 100).toFixed(1);
                                    return `${label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Create cost comparison chart
        function createCostChart() {
            const ctx = document.getElementById('costChart').getContext('2d');

            if (costChart) {
                costChart.destroy();
            }

            const costs = [
                marginData.unitCost,
                marginData.cogp || 0,
                marginData.standardCost || 0,
                marginData.lastCost || 0,
                marginData.averageCost || 0
            ];

            const labels = ['Current Cost', 'COGP', 'Standard Cost', 'Last Cost', 'Average Cost'];
            const colors = ['#007bff', '#17a2b8', '#6f42c1', '#fd7e14', '#20c997'];

            costChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Cost ($)',
                        data: costs,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return `${context.label}: ${formatCurrency(context.parsed.y)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function (value) {
                                    return formatCurrency(value);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Format percentage
        function formatPercentage(num) {
            if (num === null || num === undefined) return '0%';
            return Number(num).toFixed(1) + '%';
        }

        // Format currency
        function formatCurrency(amount) {
            if (amount === null || amount === undefined) return '$0.00';
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        // Listen for messages from parent form
        window.addEventListener('message', function (event) {
            try {
                if (event.data && event.data.type === 'updateMarginData') {
                    updateMarginAnalysis(event.data.data);
                }
            } catch (error) {
                console.error('Error processing message:', error);
            }
        });

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeCharts);

        // Initialize immediately if DOM already loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeCharts);
        } else {
            initializeCharts();
        }
    </script>
</body>
</html>
